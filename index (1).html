<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سمسار - مربوط بـ Firebase</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 14px;
      background: #f3f5f7;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      background: linear-gradient(135deg, #0f766e, #115e59);
      color: #ffffff;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .header h1 {
      margin: 0 0 4px 0;
      font-size: 22px;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      opacity: 0.92;
    }

    .badge {
      background: rgba(255, 255, 255, 0.18);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: bold;
    }

    .box {
      background: #ffffff;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .box h2 {
      margin: 0 0 12px 0;
      font-size: 17px;
      color: #0f766e;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      background: #ffffff;
      color: #111827;
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    button {
      cursor: pointer;
      border: none;
      font-weight: bold;
      transition: opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.92;
    }

    .btn-primary {
      background: #0f766e;
      color: #ffffff;
      margin-top: 10px;
    }

    .btn-pick {
      background: #f0fdfa;
      color: #0f766e;
      border: 1.5px dashed #0f766e;
      margin-top: 10px;
    }

    .btn-danger {
      background: #dc2626;
      color: #ffffff;
      padding: 8px 12px;
      font-size: 13px;
      width: auto;
    }

    .btn-link {
      display: inline-block;
      text-decoration: none;
      text-align: center;
      background: #0284c7;
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: bold;
    }

    .btn-whatsapp {
      display: inline-block;
      text-decoration: none;
      text-align: center;
      background: #16a34a;
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: bold;
    }

    .preview-box {
      margin-top: 10px;
      display: none;
      align-items: center;
      gap: 10px;
      background: #f9fafb;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }

    .preview-box img {
      width: 78px;
      height: 78px;
      object-fit: cover;
      border-radius: 8px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      border: 1px solid #e5e7eb;
    }

    .card img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 10px;
      background: #f3f4f6;
    }

    .card-title {
      margin: 0 0 6px 0;
      font-size: 16px;
      font-weight: bold;
    }

    .meta {
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 6px;
    }

    .price {
      font-size: 16px;
      font-weight: bold;
      color: #0f766e;
      margin: 8px 0;
    }

    .commission {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 10px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
    }

    .empty {
      text-align: center;
      padding: 24px;
      color: #6b7280;
      background: #ffffff;
      border-radius: 14px;
    }

    .status-msg {
      margin-top: 8px;
      font-size: 13px;
      color: #0f766e;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div>
        <h1>سمسار</h1>
        <p>مزامنة مباشرة مع Firebase</p>
      </div>
      <div class="badge" id="countBadge">جاري التحميل...</div>
    </header>

    <!-- بحث وفلترة -->
    <section class="box">
      <h2>بحث وفلترة</h2>
      <div class="grid">
        <input type="text" id="searchInput" placeholder="ابحث بالمنطقة أو العنوان..." />
        <select id="offerFilter">
          <option value="all">بيع وإيجار</option>
          <option value="بيع">بيع</option>
          <option value="إيجار">إيجار</option>
        </select>
        <select id="typeFilter">
          <option value="all">كل الأنواع</option>
          <option value="شقة">شقة</option>
          <option value="فيلا">فيلا</option>
          <option value="محل">محل</option>
          <option value="أرض">أرض</option>
          <option value="مكتب">مكتب</option>
        </select>
        <input type="number" id="maxPriceInput" placeholder="أقصى سعر (ج.م)" />
      </div>
    </section>

    <!-- إضافة عقار جديد -->
    <section class="box">
      <h2>+ إضافة عقار جديد</h2>
      <form id="listingForm">
        <div class="grid">
          <input type="text" id="titleInput" placeholder="عنوان الإعلان (مثال: شقة 140م لوكس)" required />
          <input type="text" id="areaInput" placeholder="المنطقة (مثال: المعادي)" required />
          <select id="offerInput">
            <option value="بيع">بيع</option>
            <option value="إيجار">إيجار</option>
          </select>
          <select id="typeInput">
            <option value="شقة">شقة</option>
            <option value="فيلا">فيلا</option>
            <option value="محل">محل</option>
            <option value="أرض">أرض</option>
            <option value="مكتب">مكتب</option>
          </select>
          <input type="number" id="priceInput" placeholder="السعر أو الإيجار الشهري" required />
          <input type="text" id="phoneInput" placeholder="رقم التواصل (010...)" required />
          <input type="url" id="mapInput" placeholder="رابط اللوكيشن (Google Maps)" />
        </div>

        <input type="file" id="imageFileInput" accept="image/*" style="display: none;" />
        <button type="button" class="btn-pick" id="pickImageBtn">📷 اختر صورة العقار</button>

        <div class="preview-box" id="previewBox">
          <img id="previewImg" alt="معاينة الصورة" />
          <span id="previewName" style="font-size: 13px; color: #374151;"></span>
        </div>

        <div style="margin-top: 10px;">
          <textarea id="notesInput" placeholder="تفاصيل إضافية عن العقار..."></textarea>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">حفظ الإعلان</button>
        <div class="status-msg" id="statusMsg"></div>
      </form>
    </section>

    <!-- قائمة العقارات -->
    <section>
      <div class="cards" id="listingsGrid"></div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      deleteDoc,
      doc,
      onSnapshot,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ضع بيانات الربط الخاصة بمشروع simsar-app-61742 من Firebase
    const firebaseConfig = {
      apiKey: "PUT_YOUR_API_KEY_HERE",
      authDomain: "simsar-app-61742.firebaseapp.com",
      projectId: "simsar-app-61742",
      storageBucket: "simsar-app-61742.appspot.com",
      messagingSenderId: "PUT_YOUR_SENDER_ID_HERE",
      appId: "PUT_YOUR_APP_ID_HERE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const listingsCol = collection(db, "listings");

    const countBadge = document.getElementById("countBadge");
    const listingsGrid = document.getElementById("listingsGrid");
    const listingForm = document.getElementById("listingForm");
    const statusMsg = document.getElementById("statusMsg");

    const pickImageBtn = document.getElementById("pickImageBtn");
    const imageFileInput = document.getElementById("imageFileInput");
    const previewBox = document.getElementById("previewBox");
    const previewImg = document.getElementById("previewImg");
    const previewName = document.getElementById("previewName");

    const searchInput = document.getElementById("searchInput");
    const offerFilter = document.getElementById("offerFilter");
    const typeFilter = document.getElementById("typeFilter");
    const maxPriceInput = document.getElementById("maxPriceInput");

    let allListings = [];
    let selectedImageDataUrl = "";

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text || "";
      return div.innerHTML;
    }

    function formatPrice(num) {
      return Number(num || 0).toLocaleString("en-US") + " ج.م";
    }

    function cleanPhoneForWa(phone) {
      const digits = (phone || "").replace(/\D/g, "");
      if (digits.startsWith("01") && digits.length === 11) {
        return "20" + digits;
      }
      return digits;
    }

    function compressImageToDataUrl(file, maxWidth = 800, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const scale = img.width > maxWidth ? maxWidth / img.width : 1;
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    pickImageBtn.addEventListener("click", () => {
      imageFileInput.click();
    });

    imageFileInput.addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        statusMsg.textContent = "جاري تجهيز الصورة...";
        selectedImageDataUrl = await compressImageToDataUrl(file);
        previewImg.src = selectedImageDataUrl;
        previewName.textContent = file.name;
        previewBox.style.display = "flex";
        statusMsg.textContent = "";
      } catch (err) {
        statusMsg.textContent = "تعذر قراءة الصورة: " + err.message;
      }
    });

    function renderListings() {
      const qText = searchInput.value.trim().toLowerCase();
      const offerVal = offerFilter.value;
      const typeVal = typeFilter.value;
      const maxPrice = Number(maxPriceInput.value || 0);

      const filtered = allListings.filter((item) => {
        const title = (item.title || "").toLowerCase();
        const area = (item.area || "").toLowerCase();
        const matchesText = !qText || title.includes(qText) || area.includes(qText);
        const matchesOffer = offerVal === "all" || item.offerType === offerVal;
        const matchesType = typeVal === "all" || item.propertyType === typeVal;
        const matchesPrice = !maxPrice || Number(item.price || 0) <= maxPrice;
        return matchesText && matchesOffer && matchesType && matchesPrice;
      });

      countBadge.textContent = `${filtered.length} عقار`;

      if (filtered.length === 0) {
        listingsGrid.innerHTML = `<div class="empty">لا توجد عقارات مطابقة حالياً.</div>`;
        return;
      }

      listingsGrid.innerHTML = filtered.map((item) => {
        const priceNum = Number(item.price || 0);
        const commission = Math.round(priceNum * 0.025);
        const waPhone = cleanPhoneForWa(item.phone);
        const waLink = waPhone
          ? `https://wa.me/${waPhone}?text=${encodeURIComponent("مرحباً، أستفسر عن إعلان: " + (item.title || ""))}`
          : "";

        return `
          <article class="card">
            ${item.imageData ? `<img src="${escapeHtml(item.imageData)}" alt="${escapeHtml(item.title)}" />` : ""}
            <h3 class="card-title">${escapeHtml(item.title)}</h3>
            <div class="meta">المنطقة: ${escapeHtml(item.area)} | ${escapeHtml(item.offerType)} - ${escapeHtml(item.propertyType)}</div>
            <div class="price">${formatPrice(priceNum)}</div>
            <div class="commission">عمولة مقترحة (2.5%): ${formatPrice(commission)}</div>
            ${item.notes ? `<div class="meta">${escapeHtml(item.notes)}</div>` : ""}
            ${item.phone ? `<div class="meta">هاتف: ${escapeHtml(item.phone)}</div>` : ""}

            <div class="actions">
              ${item.phone ? `<a class="btn-link" href="tel:${escapeHtml(item.phone)}">اتصال</a>` : ""}
              ${waLink ? `<a class="btn-whatsapp" href="${waLink}" target="_blank" rel="noopener">واتساب</a>` : ""}
              ${item.mapUrl ? `<a class="btn-link" href="${escapeHtml(item.mapUrl)}" target="_blank" rel="noopener">الموقع</a>` : ""}
              <button type="button" class="btn-danger" data-id="${escapeHtml(item.id)}">حذف</button>
            </div>
          </article>
        `;
      }).join("");

      document.querySelectorAll(".btn-danger").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const docId = btn.getAttribute("data-id");
          if (!docId) return;
          try {
            await deleteDoc(doc(db, "listings", docId));
          } catch (err) {
            statusMsg.textContent = "تعذر حذف العقار: " + err.message;
          }
        });
      });
    }

    listingForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusMsg.textContent = "جاري حفظ الإعلان...";

      const newListing = {
        title: document.getElementById("titleInput").value.trim(),
        area: document.getElementById("areaInput").value.trim(),
        offerType: document.getElementById("offerInput").value,
        propertyType: document.getElementById("typeInput").value,
        price: Number(document.getElementById("priceInput").value || 0),
        phone: document.getElementById("phoneInput").value.trim(),
        mapUrl: document.getElementById("mapInput").value.trim(),
        imageData: selectedImageDataUrl,
        notes: document.getElementById("notesInput").value.trim(),
        createdAt: Date.now()
      };

      try {
        await addDoc(listingsCol, newListing);
        listingForm.reset();
        selectedImageDataUrl = "";
        previewBox.style.display = "none";
        previewImg.src = "";
        previewName.textContent = "";
        statusMsg.textContent = "تم حفظ الإعلان بنجاح.";
      } catch (err) {
        statusMsg.textContent = "خطأ أثناء الحفظ: " + err.message;
      }
    });

    [searchInput, offerFilter, typeFilter, maxPriceInput].forEach((el) => {
      el.addEventListener("input", renderListings);
      el.addEventListener("change", renderListings);
    });

    const q = query(listingsCol, orderBy("createdAt", "desc"));
    onSnapshot(
      q,
      (snapshot) => {
        allListings = snapshot.docs.map((d) => ({
          id: d.id,
          ...d.data()
        }));
        renderListings();
      },
      (err) => {
        countBadge.textContent = "خطأ اتصال";
        statusMsg.textContent = "تعذر قراءة البيانات: " + err.message;
      }
    );
  </script>
</body>
</html>

          <option value="بيع">بيع</option>
          <option value="إيجار">إيجار</option>
        </select>

          <option value="شقة">شقة</option>

        <!-- اللوكيشن -->
        <input type="url" id="locationUrl" placeholder="رابط اللوكيشن (Google Maps)" />
        <button type="button" class="btn-gps" id="gpsBtn">📍 تحديد موقعي الحالي GPS</button>

        <!-- رفع صورة -->
        <div>
          <label class="file-label">
            📷 اختر صورة العقار
            <input type="file" id="imageInput" accept="image/*" />
          </label>
          <img id="previewImg" alt="معاينة" />
        </div>

        <button type="submit" id="submitBtn">حفظ الإعلان</button>
      </form>
    </div>

    <!-- قائمة العقارات -->
    <div class="cards" id="listingsGrid"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      deleteDoc,
      doc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDBCFt3zOdgi8JT-VGda4WQcd9S1wS2sSQ",
      authDomain: "simsar-app-61742.firebaseapp.com",
      projectId: "simsar-app-61742",
      storageBucket: "simsar-app-61742.firebasestorage.app",
      messagingSenderId: "914436358942",
      appId: "1:914436358942:web:9e1fa8dce13134a51ebf0f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const listingsCol = collection(db, "listings");

    let listings = [];
    let uploadedImageBase64 = "";

    const placeholderSVG = "data:image/svg+xml;utf8," + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350">
        <rect width="600" height="350" fill="#cbd5e1"/>
        <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#475569" font-family="sans-serif" font-size="22">لا توجد صورة مرفقة</text>
      </svg>`
    );

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const maxWidth = 650;
          const scale = Math.min(1, maxWidth / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;

          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          uploadedImageBase64 = canvas.toDataURL("image/jpeg", 0.65);
          const preview = document.getElementById("previewImg");
          preview.src = uploadedImageBase64;
          preview.style.display = "block";
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function getCurrentGPS() {
      const btn = document.getElementById("gpsBtn");
      if (!navigator.geolocation) {
        alert("المتصفح لا يدعم تحديد الموقع GPS.");
        return;
      }
      btn.textContent = "جاري تحديد الموقع...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          document.getElementById("locationUrl").value = `https://www.google.com/maps?q=${latitude},${longitude}`;
          btn.textContent = "✅ تم التقاط الموقع";
        },
        () => {
          alert("تعذر الوصول للموقع. تأكد من تفعيل GPS ومنح الإذن للمتصفح.");
          btn.textContent = "📍 تحديد موقعي الحالي GPS";
        }
      );
    }

    function formatWhatsApp(phone) {
      let clean = (phone || "").replace(/\D/g, "");
      if (clean.startsWith("0")) clean = "2" + clean;
      return clean;
    }

    window.deleteListing = async function(id) {
      if (!confirm("هل تريد حذف هذا العقار نهائياً من قاعدة البيانات؟")) return;
      try {
        await deleteDoc(doc(db, "listings", id));
      } catch (err) {
        console.error(err);
        alert("حدث خطأ أثناء الحذف.");
      }
    };

    window.renderListings = function() {
      const queryText = document.getElementById("searchArea").value.trim().toLowerCase();
      const dealQuery = document.getElementById("filterDeal").value;
      const typeQuery = document.getElementById("filterType").value;
      const maxPrice = Number(document.getElementById("maxPrice").value) || Infinity;

      const filtered = listings.filter(item =>
        ((item.area || "").toLowerCase().includes(queryText) || (item.title || "").toLowerCase().includes(queryText)) &&
        (!dealQuery || item.deal === dealQuery) &&
        (!typeQuery || item.type === typeQuery) &&
        Number(item.price) <= maxPrice
      );

      document.getElementById("countBadge").textContent = `${filtered.length} عقار`;
      const grid = document.getElementById("listingsGrid");

      grid.innerHTML = filtered.length
        ? filtered.map(item => {
            const priceNum = Number(item.price) || 0;
            const comm = item.deal === "بيع"
              ? `عمولة مقترحة (2.5%): ${(priceNum * 0.025).toLocaleString()} ج.م`
              : `عمولة مقترحة (شهر): ${priceNum.toLocaleString()} ج.م`;

            const mapLink = item.locationUrl
              ? item.locationUrl
              : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.area || "")}`;

            const waText = encodeURIComponent(
              `مرحباً، أستفسر بخصوص إعلان: ${item.title} في ${item.area}\nالموقع: ${mapLink}`
            );

            return `
              <div class="card">
                <img class="card-img" src="${item.image || placeholderSVG}" alt="${item.title}" />
                <div class="card-body">
                  <div>
                    <div class="badges">
                      <span class="badge badge-deal">${item.deal}</span>
                      <span class="badge">${item.type} - ${item.area}</span>
                    </div>
                    <h3>${item.title}</h3>
                    <div class="price">${priceNum.toLocaleString()} ج.م ${item.deal === "إيجار" ? "/ شهرياً" : ""}</div>
                    <div class="commission">${comm}</div>
                  </div>
                  <div class="actions">
                    <a class="btn-link btn-call" href="tel:${item.phone}">اتصال</a>
                    <a class="btn-link btn-wa" target="_blank" href="https://wa.me/${formatWhatsApp(item.phone)}?text=${waText}">واتساب</a>
                    <a class="btn-link btn-map" target="_blank" href="${mapLink}">الموقع</a>
                    <button class="btn-del" onclick="deleteListing('${item.id}')">حذف</button>
                  </div>
                </div>
              </div>
            `;
          }).join("")
        : `<div class="box">لا توجد عقارات مطابقة لبحثك.</div>`;
    };

    document.getElementById("imageInput").addEventListener("change", handleImageUpload);
    document.getElementById("gpsBtn").addEventListener("click", getCurrentGPS);

    document.getElementById("addForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = "جاري الحفظ...";

      try {
        await addDoc(listingsCol, {
          title: document.getElementById("title").value.trim(),
          area: document.getElementById("area").value.trim(),
          deal: document.getElementById("deal").value,
          type: document.getElementById("type").value,
          price: Number(document.getElementById("price").value),
          phone: document.getElementById("phone").value.trim(),
          locationUrl: document.getElementById("locationUrl").value.trim(),
          image: uploadedImageBase64,
          createdAt: serverTimestamp()
        });

        this.reset();
        uploadedImageBase64 = "";
        document.getElementById("previewImg").style.display = "none";
        document.getElementById("gpsBtn").textContent = "📍 تحديد موقعي الحالي GPS";
      } catch (err) {
        console.error(err);
        alert("تعذر حفظ الإعلان. تحقق من إعدادات Firebase وقواعد Firestore.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "حفظ الإعلان";
      }
    });

    const q = query(listingsCol, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      listings = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      renderListings();
    }, (err) => {
      console.error(err);
      document.getElementById("countBadge").textContent = "خطأ في الاتصال";
    });
  </script>
</body>
</html>
